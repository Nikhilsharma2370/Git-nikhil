<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Card</title>
<style>
  :root {
    --card-bg: rgba(21, 23, 28, 0.86);
    --card-border: rgba(255, 255, 255, 0.10);
    --cell-empty: rgba(255, 255, 255, 0.06);
    --cell-empty-border: rgba(255, 255, 255, 0.07);
    --accent: #2F6BFF;
    --accent-light: #5B8CFF;
    --text: #F3F3F3;
    --muted: #8A8F98;
  }
  html, body {
    margin: 0;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: transparent;
    font-family: "Inter", "Inter Display", -apple-system, "SF Pro Display", sans-serif;
  }
  /* Preview mode: dark studio background + caption, sirf dekhne ke liye */
  body.preview {
    background:
      radial-gradient(ellipse 70% 45% at 50% 30%, #3a3632 0%, transparent 70%),
      linear-gradient(180deg, #23201d 0%, #141210 60%, #090807 100%);
  }
  .caption {
    position: absolute;
    left: 0; right: 0;
    top: 900px;
    text-align: center;
    color: var(--text);
    font-weight: 500;
    font-size: 64px;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    display: none;
  }
  body.preview .caption { display: block; }

  .card {
    position: absolute;
    left: 50%;
    top: 1010px;
    width: 700px;
    margin-left: -350px;
    box-sizing: border-box;
    padding: 34px 34px 38px;
    border-radius: 34px;
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(24px);
    will-change: transform, opacity, filter;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--text);
    font-size: 30px;
    font-weight: 500;
    letter-spacing: -0.2px;
  }
  .count { font-variant-numeric: tabular-nums; color: var(--text); }
  .count .total { color: var(--muted); }
  .bar {
    margin-top: 18px;
    height: 6px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
    box-shadow: 0 0 12px rgba(47, 107, 255, 0.7);
  }
  .grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 16px;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    background: var(--cell-empty);
    border: 2px solid var(--cell-empty-border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box;
  }
  .cell .fill {
    position: absolute;
    inset: -2px;
    border-radius: 18px;
    background: linear-gradient(180deg, #4A80FF 0%, var(--accent) 100%);
    box-shadow: 0 0 18px rgba(47, 107, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    opacity: 0;
  }
  .cell .num { position: relative; }
  .cell .ring {
    position: absolute;
    inset: -8px;
    border-radius: 24px;
    border: 3px solid var(--accent-light);
    box-shadow: 0 0 24px rgba(91, 140, 255, 0.8);
    opacity: 0;
  }
</style>
</head>
<body>
  <div class="caption">to posting</div>
  <div class="card" id="card">
    <div class="header" id="header">
      <span>Next 30 days</span>
      <span class="count"><span id="done">0</span><span class="total">/30</span></span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
  // Settings
  const DURATION = 4.0;      // seconds
  const TOTAL_DAYS = 30;
  const POSTED = 15;         // kitne din blue honge (last wala "today" glow)

  const grid = document.getElementById('grid');
  const cells = [];
  for (let i = 1; i <= TOTAL_DAYS; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    c.innerHTML = '<div class="fill"></div><div class="ring"></div><span class="num">' + i + '</span>';
    grid.appendChild(c);
    cells.push({ el: c, fill: c.querySelector('.fill'), ring: c.querySelector('.ring'), num: c.querySelector('.num') });
  }
  const card = document.getElementById('card');
  const header = document.getElementById('header');
  const done = document.getElementById('done');
  const barFill = document.getElementById('barFill');

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const prog = (t, start, len) => clamp((t - start) / len);
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  // Pop: 0 → overshoot → 1
  const pop = p => {
    if (p <= 0) return 0;
    if (p >= 1) return 1;
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  };

  // Timeline (seconds)
  const T = {
    cardIn: 0.0,   cardInLen: 0.45,
    headerIn: 0.2, headerInLen: 0.35,
    cellsIn: 0.3,  cellStagger: 0.012, cellInLen: 0.25,
    fillStart: 0.85, fillStagger: 0.085, fillLen: 0.22,
    ringStart: 0.85 + 0.085 * (POSTED - 1) + 0.15, ringLen: 0.5,
    exit: 3.45,    exitLen: 0.4,
  };

  function render(t) {
    // Card entry: neeche se upar + fade + blur → sharp
    const pin = easeOut(prog(t, T.cardIn, T.cardInLen));
    const pout = easeInOut(prog(t, T.exit, T.exitLen));
    const y = (1 - pin) * 50 + pout * 30;
    const s = 0.96 + 0.04 * pin;
    const blur = (1 - pin) * 14 + pout * 10;
    card.style.opacity = (pin * (1 - pout)).toFixed(3);
    card.style.transform = `translateY(${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
    card.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : 'none';

    const ph = easeOut(prog(t, T.headerIn, T.headerInLen));
    header.style.opacity = ph.toFixed(3);
    header.style.transform = `translateY(${((1 - ph) * 12).toFixed(2)}px)`;

    // Cells: ek-ek karke aate hain (grey)
    cells.forEach((c, i) => {
      const p = easeOut(prog(t, T.cellsIn + i * T.cellStagger, T.cellInLen));
      c.el.style.opacity = p.toFixed(3);
      c.el.style.transform = `translateY(${((1 - p) * 10).toFixed(2)}px) scale(${(0.85 + 0.15 * p).toFixed(4)})`;
    });

    // Fill: 1 → POSTED blue hote hain, counter aur bar saath badhte hain
    let count = 0;
    cells.forEach((c, i) => {
      if (i >= POSTED) {
        c.fill.style.opacity = 0;
        c.num.style.color = '';
        return;
      }
      const start = T.fillStart + i * T.fillStagger;
      const p = prog(t, start, T.fillLen);
      if (t >= start + T.fillLen * 0.4) count = i + 1;
      c.fill.style.opacity = easeOut(p).toFixed(3);
      const sc = p > 0 ? 0.7 + 0.3 * pop(p) : 1;
      c.fill.style.transform = `scale(${sc.toFixed(4)})`;
      c.num.style.color = p > 0.3 ? '#FFFFFF' : '';
    });
    done.textContent = count;
    barFill.style.width = (count / TOTAL_DAYS * 100).toFixed(2) + '%';

    // Today (last posted cell): glow ring pulse
    const today = cells[POSTED - 1];
    const pr = prog(t, T.ringStart, T.ringLen);
    if (pr > 0) {
      const settle = easeOut(pr);
      today.ring.style.opacity = (0.35 + 0.65 * settle).toFixed(3);
      today.ring.style.transform = `scale(${(1.25 - 0.25 * settle).toFixed(4)})`;
    } else {
      today.ring.style.opacity = 0;
    }
  }

  // Frame-by-frame render ke liye (render script isse call karti hai)
  window.renderAt = render;
  window.DURATION = DURATION;

  // Browser me khologe to loop me chalega. ?preview=1 se background + caption
  const params = new URLSearchParams(location.search);
  if (params.has('preview')) document.body.classList.add('preview');
  if (!params.has('static')) {
    const t0 = performance.now();
    const loop = now => {
      render(((now - t0) / 1000) % (DURATION + 0.6));
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  } else {
    render(0);
  }
</script>
</body>
</html>
